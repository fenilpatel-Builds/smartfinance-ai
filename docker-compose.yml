version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: smartfinance-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - smartfinance-net

  # Python Document Extraction & OCR Service
  python-engine:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: smartfinance-python-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    networks:
      - smartfinance-net

  # Node.js Express Main Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartfinance-node-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - python-engine
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/smartfinance
      - PYTHON_SERVICE_URL=http://python-engine:8000
      - JWT_SECRET=smartfinance_super_secret_production_jwt_key_2026
      - CLIENT_URL=http://localhost
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - smartfinance-net

  # React Frontend Single Page App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smartfinance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
    networks:
      - smartfinance-net

volumes:
  mongo_data:
  backend_uploads:

networks:
  smartfinance-net:
    driver: bridge

